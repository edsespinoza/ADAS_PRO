<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1018"/>
      <stop offset="50%" stop-color="#111d2e"/>
      <stop offset="100%" stop-color="#1B2B4D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#e85520"/>
    </linearGradient>
    <linearGradient id="tech" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0096b4"/>
    </linearGradient>
  </defs>
  <!-- Fundo -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid decorativo -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="0" y1="630" x2="1200" y2="630"/>
  </g>
  <!-- Elementos decorativos -->
  <circle cx="1050" cy="100" r="200" fill="url(#accent)" opacity="0.06"/>
  <circle cx="1100" cy="500" r="150" fill="url(#tech)" opacity="0.05"/>
  <rect x="0" y="0" width="6" height="630" fill="url(#accent)"/>
  <!-- Logo hex -->
  <rect x="60" y="50" width="52" height="52" rx="10" fill="#1B2B4D" stroke="#FF6B35" stroke-width="2"/>
  <text x="86" y="82" font-family="Poppins, Arial, sans-serif" font-weight="800" font-size="24" fill="#FF6B35" text-anchor="middle">AP</text>
  <!-- Título -->
  <text x="60" y="270" font-family="Poppins, Arial, sans-serif" font-weight="800" font-size="54" fill="#ffffff">Domine</text>
  <text x="60" y="340" font-family="Poppins, Arial, sans-serif" font-weight="800" font-size="54" fill="#FF6B35">Sistemas ADAS.</text>
  <text x="60" y="410" font-family="Poppins, Arial, sans-serif" font-weight="400" font-size="32" fill="#00B4D8">Atenda com Autoridade.</text>
  <!-- Subtítulo -->
  <text x="60" y="470" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="18" fill="#8899aa">Mentoria técnica para mecânicos e auto centers</text>
  <!-- Stats -->
  <g transform="translate(60, 530)">
    <rect x="0" y="0" width="160" height="60" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="80" y="26" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="22" fill="#FF6B35" text-anchor="middle">51+</text>
    <text x="80" y="48" font-family="Inter, Arial, sans-serif" font-size="11" fill="#667788" text-anchor="middle">Marcas cobertas</text>
  </g>
  <g transform="translate(240, 530)">
    <rect x="0" y="0" width="160" height="60" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="80" y="26" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="22" fill="#00B4D8" text-anchor="middle">350+</text>
    <text x="80" y="48" font-family="Inter, Arial, sans-serif" font-size="11" fill="#667788" text-anchor="middle">Modelos suportados</text>
  </g>
  <g transform="translate(420, 530)">
    <rect x="0" y="0" width="160" height="60" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="80" y="26" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="22" fill="#ffffff" text-anchor="middle">6</text>
    <text x="80" y="48" font-family="Inter, Arial, sans-serif" font-size="11" fill="#667788" text-anchor="middle">Regiões globais</text>
  </g>
  <!-- Illustration decorativa (radar abstract) -->
  <g transform="translate(820, 200)" opacity="0.12">
    <circle cx="100" cy="100" r="90" fill="none" stroke="#00B4D8" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="60" fill="none" stroke="#00B4D8" stroke-width="1"/>
    <circle cx="100" cy="100" r="30" fill="none" stroke="#00B4D8" stroke-width="1"/>
    <line x1="100" y1="100" x2="160" y2="60" stroke="#FF6B35" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="4" fill="#FF6B35"/>
  </g>
  <!-- ADAS PRO text no topo direito -->
  <text x="1140" y="80" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="18" fill="#ffffff" text-anchor="end">ADAS</text>
  <text x="1140" y="100" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="18" fill="#FF6B35" text-anchor="end">PRO</text>
</svg>
