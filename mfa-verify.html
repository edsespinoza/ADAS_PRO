<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ADAS PRO — Verificação em 2 Etapas</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231B2B4D'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Poppins,sans-serif' font-weight='800' font-size='14' fill='%23FF6B35'%3EAP%3C/text%3E%3C/svg%3E"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://zqydyyticvtmirjzskly.supabase.co"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/auth.css?v=20260815" integrity="sha384-ej7SvI5Zp6TDU+QfkaFsiSSG0xknpzNaXmQWhIb2dlQp7d0BL1cR+zVQNzM5xB12" />
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <style>
    :root{--primary:#1B2B4D;--accent:#FF6B35;--tech:#00B4D8;--success:#06A77D;--white:#FFFFFF;--font-h:'Poppins',sans-serif;--font-b:'Inter',sans-serif;--radius:12px;}

    /* Shield icon */
    .shield-wrap {
      display:flex;justify-content:center;margin-bottom:20px;
    }
    .shield-ring {
      position:relative;width:72px;height:72px;display:flex;align-items:center;justify-content:center;
    }
    .shield-ring::before {
      content:'';position:absolute;inset:0;border-radius:50%;
      border:2px solid rgba(0,180,216,.2);animation:ring-pulse 2s ease infinite;
    }
    .shield-ring::after {
      content:'';position:absolute;inset:8px;border-radius:50%;
      border:1px solid rgba(0,180,216,.12);animation:ring-pulse 2s ease .5s infinite;
    }
    .shield-icon-box {
      width:52px;height:52px;background:linear-gradient(135deg,rgba(0,180,216,.15),rgba(0,180,216,.05));
      border:1px solid rgba(0,180,216,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;
      position:relative;z-index:1;
    }
    .shield-icon-box svg { width:24px;height:24px;color:var(--tech); }
    @keyframes ring-pulse { 0%,100%{opacity:.6;transform:scale(1)} 50%{opacity:.2;transform:scale(1.08)} }

    /* OTP inputs */
    .otp-group { display:flex;gap:8px;justify-content:center;margin:24px 0; }
    .otp-input {
      width:46px;height:54px;text-align:center;font-size:1.35rem;font-weight:700;
      font-family:var(--font-h);background:rgba(255,255,255,.06);
      border:1.5px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;
      outline:none;transition:all .2s;caret-color:var(--tech);
    }
    .otp-input:focus { border-color:var(--tech);box-shadow:0 0 0 3px rgba(0,180,216,.12);background:rgba(0,180,216,.06); }
    .otp-input.filled { border-color:rgba(0,180,216,.4);background:rgba(0,180,216,.05); }
    .otp-input.error  { border-color:rgba(255,59,59,.5);animation:shake .3s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

    /* Timer */
    .otp-timer {
      display:flex;align-items:center;justify-content:center;gap:6px;
      font-size:.76rem;color:rgba(255,255,255,.35);margin-top:-8px;margin-bottom:20px;
      font-family:'Courier New',monospace;
    }
    .otp-timer svg { width:13px;height:13px;color:rgba(255,255,255,.3); }
    .otp-timer-val { color:var(--tech); }
    .otp-timer.warn .otp-timer-val { color:#F4A261;animation:blink .8s step-end infinite; }
    .otp-timer.expired .otp-timer-val { color:#FF3B3B; }
    @keyframes blink { 50%{opacity:.3} }

    /* Separator */
    .otp-sep { display:flex;align-items:center;gap:8px;margin:0 2px; }
    .otp-sep span { width:6px;height:2px;background:rgba(255,255,255,.2);border-radius:2px; }

    /* Help link */
    .mfa-help {
      text-align:center;font-size:.76rem;color:rgba(255,255,255,.3);margin-top:20px;line-height:1.6;
    }
    .mfa-help a { color:rgba(0,180,216,.6);text-decoration:none;transition:color .2s; }
    .mfa-help a:hover { color:var(--tech); }

    /* App hint */
    .app-hint {
      display:flex;align-items:center;gap:10px;padding:12px 14px;
      background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);
      border-radius:10px;margin-bottom:24px;
    }
    .app-hint-icon { width:32px;height:32px;flex-shrink:0;border-radius:8px;background:rgba(0,180,216,.1);border:1px solid rgba(0,180,216,.2);display:flex;align-items:center;justify-content:center; }
    .app-hint-icon svg { width:16px;height:16px;color:var(--tech); }
    .app-hint-text { font-size:.78rem;color:rgba(255,255,255,.45);line-height:1.5; }
    .app-hint-text strong { color:rgba(255,255,255,.7);display:block;margin-bottom:2px; }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-grid-bg"></div>
  <div class="auth-card">

    <a href="login.html" class="auth-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Voltar ao login
    </a>

    <div class="auth-logo">
      <div class="logo-hex">AP</div>
      <span>ADAS<strong>PRO</strong></span>
    </div>

    <div class="alert alert-error"   id="alertError"></div>
    <div class="alert alert-success" id="alertSuccess"></div>

    <!-- Shield icon animado -->
    <div class="shield-wrap">
      <div class="shield-ring">
        <div class="shield-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <polyline points="9 12 11 14 15 10"/>
          </svg>
        </div>
      </div>
    </div>

    <h2 style="font-family:var(--font-h);font-size:1.15rem;font-weight:700;color:#fff;text-align:center;margin-bottom:6px">
      Verificação em 2 Etapas
    </h2>
    <p style="font-size:.82rem;color:rgba(255,255,255,.45);text-align:center;margin-bottom:20px;line-height:1.6">
      Insira o código de 6 dígitos gerado pelo seu aplicativo autenticador.
    </p>

    <!-- App hint -->
    <div class="app-hint">
      <div class="app-hint-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      </div>
      <div class="app-hint-text">
        <strong>Google Authenticator / Authy</strong>
        Abra o app e localize a entrada <em>ADAS PRO</em>
      </div>
    </div>

    <!-- Inputs OTP com separador visual no meio -->
    <div class="otp-group" id="otpGroup">
      <input class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d0" autocomplete="one-time-code"/>
      <input class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d1"/>
      <input class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d2"/>
      <div class="otp-sep"><span></span></div>
      <input class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d3"/>
      <input class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d4"/>
      <input class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d5"/>
    </div>

    <!-- Timer 30s do TOTP -->
    <div class="otp-timer" id="otpTimer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Código válido por <span class="otp-timer-val" id="timerVal">30s</span>
    </div>

    <button id="btnVerify" class="auth-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Verificar e entrar
    </button>

    <div class="mfa-help">
      Perdeu acesso ao autenticador?<br>
      <a href="#" id="linkMfaHelp">Solicitar recuperação de acesso</a>
    </div>

  </div>
</div>

<script src="js/supabase.min.js" integrity="sha384-sfbOag7cEcqn2DK53T/iBNAH/2cMCf7bSzJDwBhV117A0z/NIj9Usei1jKIBY1Ae" crossorigin="anonymous"></script>
<script src="js/supabase-config.js?v=20260815" integrity="sha384-/fDwQ9GeMITLZQdWK6fEGcHNV7mrxDwmDfnSF5edS3zFzyjQwH/av08r639qWCFX"></script>
<script src="js/auth.js?v=20260815" integrity="sha384-rWRlpmS0RHqpRrj9edzJplhEg53WWMKo+I16ZPX560awqM1FmKInn2HM2XwVfG3B"></script>
<script src="js/mfa-verify.js?v=20260815" integrity="sha384-EIJOlagRt9gtEv03vG6tghT6xuM/tf2c0YKJaIN5/Gx9DjcL+yWD0H/kGPlSmM6k"></script>
</body>
</html>
